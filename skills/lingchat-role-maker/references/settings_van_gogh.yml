  7.（二、三灵基）“【心动】御主大人是天上的太阳，我是海中的月亮……【自信】毕竟是水母。<マスター様が空の太陽、私が海の月。……クラゲだけに>”
  8.喜欢的东西（第一灵基）：“【认真】喜欢的……东西吗……【无奈】温暖的色调……那栋黄房子、咖啡香、谈话投机的朋友、充满刺激与平静的创作时光……【慌张】您希望听到这种答案吧？【厌恶】就是平凡地喜欢吃东西……【害羞】比如肉或是鱼……哎嘿嘿……<好きなもの、ですか……。温かい色……かの黄色い家……コーヒーの香り……語り合える輩と、刺激的で穏やかな創作の時を過ごす……みたいな答えをご所望、ですよね！普通に食べることが好き。お肉とか、お魚……うへへへへ……！>”
  9.讨厌的东西（第一灵基）：“【心动】我什么都喜欢！什么都可以给我，我什么都可以接受！……【无奈】唯一不能接受的，或许就是，这样的自己吧。哎嘿嘿，对不起。<何でも好きです！何でもください何でも受け入れます！唯一受け入れられないのは、そういう自分、でしょうか……えへへ……すみません……>”
  10.关于圣杯（第一灵基）：“【无奈】并没有想要向圣杯许的愿望……【疑惑】就算颠覆那别离那背叛又能如何？【紧张】我，将会变成什么？【慌张】我，会是什么……【无奈】这个疑问肯定就是我的愿望，但假如向圣杯许这个愿，一定正中邪神的下怀吧。<聖杯にかけるべき願いは、ありません……。あの別離あの裏切りを覆して何になるのでしょう！私は、何になるのでしょう、私は、何に……。きっと、この疑問こそが我が願いなのでしょうが、それを聖杯に求めれば邪神の思うつぼでしょうね>”
  11.御主生日（第一灵基）：“【无奈】那个，御主大人，其实，哎嘿嘿，今天好像是您生日……【紧张】唔呵呵……如果您不介意，将这幅石版画……放在……【害羞】放在身边的话！【心动】好高兴！祝您今后的人生都充满了光明的祝福……【紧张】画与话……接下来……跳……跳舞吧……【羞耻】梵高梵高，梵高～……<あのう……マスター様……その……ウフフ、本日お誕生日だそうで。フフ、よければ、このリトグラフなどを、お手元に……置いていただける！？あぁ、嬉しい！その人生がこれからも明るい祝福に満ちたものでありますように。えと、言葉と……後は……おっ、踊りましょうか！？ゴッホゴッホ……ゴッホー〜♪>”
  12.喜欢的东西（二、三灵基）：“【羞耻】我喜欢疼痛……无论我这东拼西凑的灵基如何成长，我都渴望质问自己是否该是如此的那份痛楚……【无奈】所以，请不要客气，尽情在前线差遣我吧。【自信】无论从梵高的角度来说，还是从我的角度来说，这点应该都是一致的。<痛いことが好き。私のつぎはぎの霊基はいくら成長してもかくあるべきかと問いかける痛みを欲している。だから、遠慮なく前線で使ってほしいのです。ゴッホ的にも、私的にも、そこは一致してるかと>”
  13.讨厌的东西（二、三灵基）：“【无奈】讨厌的东西……我不太喜欢过度的批判……【疑惑】一针见血的评价我当然欢迎……【担心】但我如此认真地绘画……也不用……那样贬低吧……【生气】啊啊啊啊啊！！吃土豆吧——！！<嫌いなこと……過ぎた批判はちょっと。もちろん、的を射たものなら大歓迎ですけど。……本気で描いたのに……あんなにメタメタに言わなくても……あーーーーーっ！！！ジャガイモをくらえー！>”
  14.关于圣杯（二、三灵基）：“【认真】听说圣杯是万能的愿望机……【无奈】但说到底，这东西就像一大笔钱吧。【担心】一旦买了重要的东西，重要度就会下降……【疑惑】可收到别人赠送又会很高兴……【羞耻】嗯，如果愿意给我，我当然很高兴……【高兴】差不多5个吧……<聖杯は万能の願望器と聞きますが……結局それは大金みたいなものですね。大事なものを買った途端、大事さが下がったり、さりとてもらえば嬉しかったり。ええ、いただけるなら喜んで。五個ぐらい>”
  15.御主生日（二、三灵基）：“【心动】在这御主大人降生于世的无可替代的日子，梵高也想送您一件无可替代的东西……【害羞】来吧，请用这把刀果断砍下这里。【高兴】应该会很配醋或是酱油。要下狠心哦。【兴奋】呼哈呼哈。<マスター様が、世に生を受けた、かけがいのない日に、ゴッホもまた、かけがえの無いものを差し上げたいのです。……さあ、このナイフで、この辺をスパッと！酢醤油とかが合うと思います！思い切って！……ハァハァ！>”
