body_part: {}                # 空对象，占位
scale: 1.0                   # 立绘缩放 f64（浮点字面量）；半身立绘默认 1.0
offset_x: 0.0
offset_y: 0.0
clothes_name: null           # 当前默认服装名（TODO 按用户确认的服装名填；无则 null）
clothes:                     # 服装列表，每套 = name + prompt（prompt 描述该形态外貌/气质）
- name: 第一灵基             # TODO：服装名与 prompt 需用户确认（但丁 5 套服装，参照梵高母版写法）
  prompt: TODO：描述该形态外貌/气质的原文
- name: 灵基再临2            # TODO：其余服装照此格式追加，数量与用户确认的服装数一致
  prompt: TODO：……
scale_p: 1.75               # 桌宠缩放（默认 1.75，1.0 会露下白边）
offset_x_p: 0.0
offset_y_p: -20.0
voice_models:                # 语音模型配置（必须 20 字段齐全，见 voice_models_20字段.md）
  sva_speaker_id: '0'                    # SVA 引擎说话人 id（字符串）
  sbv2_name: Dante Alighieri             # 外部 SBV2 服务模型名（= 训练模型名）
  sbv2_speaker_id: '0'                   # 外部 SBV2 说话人 id（字符串）
  bv2_speaker_id: '0'                    # BV2 引擎说话人 id（字符串）
  sbv2api_name: Dante Alighieri          # sbv2api 引擎模型名
  sbv2api_speaker_id: '0'                # sbv2api 说话人 id（字符串）
  gsv_voice_text: ''                     # GPT-SoVITS 备用文本（未用留空）
  gsv_voice_filename: ''                 # GPT-SoVITS 参考音频文件名（未用留空）
  gsv_gpt_model_name: ''                 # GPT-SoVITS GPT 模型名（未用留空）
  gsv_sovits_model_name: ''              # GPT-SoVITS SoVITS 模型名（未用留空）
  aivis_model_uuid: ''                   # Aivis 引擎模型 uuid（未用留空）
  opentts_voice: null                    # OpenTTS 音色（未用 null）
  fish_s2_voice: null                    # Fish-S2 音色（未用 null）
  sbv2_local_voice_id: dante-alighieri   # 本地 SBV2 语音 id（kebab-case ASCII 小写，见 pro 第 5 章）
  sbv2_local_speaker_id: 0               # 本地 SBV2 说话人 id（整数）
  sbv2_local_style_id: null              # 本地 SBV2 风格 id（整数或 null）
  sbv2_local_length_scale: null          # 本地 TTS 语速（null=默认 1.0，见 pro 第 5 章）
  sbv2_local_sdp_ratio: null             # 本地 TTS SDP 混合比（null=默认）
  sbv2_local_cloud_fallback_model: null  # 本地 TTS 云端备用模型（未用 null）
  sbv2_local_cloud_fallback_speaker_id: null  # 云端备用说话人 id（未用 null）
tts_type: sbv2
voice_lang: ja
thinking_message: 但丁在思考要不要用呵呵延长思考时间……   # 思考气泡文案（来自速通版 4.4.1 注释，贴合角色性格）
