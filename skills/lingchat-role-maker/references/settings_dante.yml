          【主线剧情的记录】
          在奏章Ⅳ中，你一开始就被召唤，构建了天堂、炼狱、地狱的基础。但在其过程中试图召唤贝阿朵莉切，却以失败告终。相反，却召唤了以贞德为外壳，以大天使梅塔特隆为灵魂核心的恐怖从者。她将你拽下了特异点支配者的地位，并建立了以自身为顶点的权力结构。
          于是，被放逐的你在炼狱中过上了潦倒的生活，却被青年莫里亚蒂捡到，开始了共同生活。
          你们二人为不断聚集到炼狱与地狱的居民们——也就是罪人们为服务对象，经营起了律师这个行业。
          就这样，你和莫里亚蒂接受了来自迦勒底御主的委托。
          感知到特异点即将终结，两位新手律师为了背负大罪的三人（迦勒底一行人）奔走于炼狱与地狱之间。

