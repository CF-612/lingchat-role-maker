# ⚠️ 本文件是「板块写法参考母版」，不是完整成品 settings.yml
#
# 用途：与 settings_van_gogh.yml 对照，展示【主线剧情的记录】板块的写法（梵高母版没有该板块）。
# 但丁走的是 FGO 主线（奏章Ⅳ），因此 system_prompt 比梵高多出【主线剧情的记录】。
#
# 填写纪律（红线 1 不编造）：
# - 标 TODO 的内容 = 需要按速通版 1.4 爬取 fgo.wiki 资料/语音留档后填写，禁止凭记忆或编造；
# - 【主线剧情的记录】段落为用户提供的 fgo.wiki 原文，可直接用（第二人称转述已完成）；
# - 顶层字段顺序与 settings_van_gogh.yml 完全一致（两成品实测一致，勿改动顺序）；
# - voice_models 必须 20 字段齐全（见 voice_models_20字段.md），此处照梵高母版结构替换模型名；
# - user_name / system_prompt 御主段是用户私货，新角色必须由用户提供自己的御主设定。
#
# 与梵高母版的差异速览：
#   1. 多【主线剧情的记录】板块（用户提供的原文，见下）；
#   2. 梵高有【主线物语的记录】（虚数大海战），但丁是主线角色 → 用【主线剧情的记录】；
#   3. 但丁 5 套服装（梵高 6 套），clothes 数量不同。

ai_name: 但丁
ai_subtitle: Pretender
user_name: 用户填写              # 御主名，由用户自定义，别替用户编
user_subtitle: Master        # 御主副标题
title: 神曲的作者，吟游诗人       # 角色称号（来自速通版 4.4.1 注释；如与用户认知不符以用户为准）
